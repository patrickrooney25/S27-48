<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mesh Network Operations & Control Console</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --good: #22c55e;
      --degraded: #f97316;
      --poor: #ef4444;
      --accent: #38bdf8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: monospace, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 20px; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .card { background-color: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 15px; }
    h2 { font-size: 1.1rem; margin-bottom: 12px; color: var(--accent); }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); }
    th { color: var(--text-muted); }
    .badge { padding: 2px 6px; border-radius: 4px; font-weight: bold; }
    .badge-good { background: rgba(34, 197, 94, 0.2); color: var(--good); }
    .badge-degraded { background: rgba(249, 115, 22, 0.2); color: var(--degraded); }
    .badge-poor { background: rgba(239, 68, 68, 0.2); color: var(--poor); }
    .form-group { margin-bottom: 12px; }
    label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 4px; }
    select, input[type="range"], input[type="number"] { width: 100%; padding: 6px; background: #0f172a; border: 1px solid var(--border); color: var(--text); border-radius: 4px; }
    .btn-row { display: flex; gap: 10px; margin-top: 15px; }
    button { flex: 1; padding: 8px 12px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    .btn-impair { background: #dc2626; color: white; }
    .btn-reset { background: #475569; color: white; }
    button:hover { opacity: 0.9; }
    #log { height: 120px; overflow-y: auto; background: #0b1120; border: 1px solid var(--border); padding: 8px; font-size: 0.75rem; border-radius: 4px; }
    .status-dot { height: 10px; width: 10px; border-radius: 50%; display: inline-block; margin-right: 6px; background: var(--good); }
  </style>
</head>
<body>

  <header>
    <div>
      <h1>Mesh Control &amp; Telemetry Console</h1>
      <small style="color: var(--text-muted);"><span class="status-dot" id="pollDot"></span>Polling daemon every 1s</small>
    </div>
    <div id="summary">Nodes: <span id="nodeCount">0</span> | Links: <span id="linkCount">0</span></div>
  </header>

  <div class="grid">
    <!-- Telemetry Column -->
    <div class="card">
      <h2>Live Link Telemetry</h2>
      <table>
        <thead>
          <tr>
            <th>Link</th>
            <th>Egress IF</th>
            <th>TQ Metric</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="linksBody">
          <tr><td colspan="4">Awaiting telemetry poll...</td></tr>
        </tbody>
      </table>
    </div>

    <!-- Fault Injection Column -->
    <div class="card">
      <h2>Fault Injection Controller</h2>
      <div class="form-group">
        <label>Target Node</label>
        <select id="nodeSelect">
          <option value="vnode1">vnode1</option>
          <option value="vnode2">vnode2</option>
          <option value="vnode3">vnode3</option>
          <option value="vnode4">vnode4</option>
          <option value="vnode5">vnode5</option>
          <option value="vnode6">vnode6</option>
        </select>
      </div>

      <div class="form-group">
        <label>Egress Interface</label>
        <select id="ifaceSelect">
          <option value="veth1-2">veth1-2</option>
          <option value="veth1-4">veth1-4</option>
          <option value="veth2-1">veth2-1</option>
          <option value="veth2-3">veth2-3</option>
          <option value="veth2-4">veth2-4</option>
          <option value="veth3-2">veth3-2</option>
          <option value="veth3-6">veth3-6</option>
          <option value="veth4-1">veth4-1</option>
          <option value="veth4-2">veth4-2</option>
          <option value="veth4-5">veth4-5</option>
          <option value="veth5-4">veth5-4</option>
          <option value="veth5-6">veth5-6</option>
          <option value="veth6-3">veth6-3</option>
          <option value="veth6-5">veth6-5</option>
        </select>
      </div>

      <div class="form-group">
        <label>Packet Loss (%): <span id="lossVal">0</span>%</label>
        <input type="range" id="lossInput" min="0" max="100" value="0" oninput="document.getElementById('lossVal').innerText = this.value">
      </div>

      <div class="form-group">
        <label>Latency Delay (ms)</label>
        <input type="number" id="delayInput" min="0" max="2000" value="0">
      </div>

      <div class="btn-row">
        <button class="btn-impair" onclick="applyImpairment()">Apply Impairment</button>
        <button class="btn-reset" onclick="resetInterface()">Clear Impairment</button>
      </div>

      <h2 style="margin-top: 15px;">Action Log</h2>
      <div id="log"></div>
    </div>
  </div>

  <script>
    function logMsg(msg) {
      const log = document.getElementById("log");
      const ts = new Date().toLocaleTimeString();
      log.innerHTML = `[${ts}] ${msg}<br/>` + log.innerHTML;
    }

    async function fetchTopology() {
      try {
        const res = await fetch('/api/v1/topology');
        if (!res.ok) return;
        const data = await res.json();

        document.getElementById('nodeCount').innerText = data.nodes.length;
        document.getElementById('linkCount').innerText = data.links.length;

        const tbody = document.getElementById('linksBody');
        tbody.innerHTML = '';

        data.links.forEach(l => {
          let badgeClass = 'badge-good';
          if (l.tq < 150) badgeClass = 'badge-poor';
          else if (l.tq < 200) badgeClass = 'badge-degraded';

          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td><strong>${l.source} &harr; ${l.target}</strong></td>
            <td>${l.egress_interface}</td>
            <td>${l.tq} / 255</td>
            <td><span class="badge ${badgeClass}">${l.tq >= 200 ? 'Optimal' : l.tq >= 150 ? 'Degraded' : 'Poor'}</span></td>
          `;
          tbody.appendChild(tr);
        });
      } catch (err) {
        console.error("Telemetry fetch failed:", err);
      }
    }

    async function applyImpairment() {
      const node = document.getElementById("nodeSelect").value;
      const iface = document.getElementById("ifaceSelect").value;
      const loss = parseInt(document.getElementById("lossInput").value, 10);
      const delay = parseInt(document.getElementById("delayInput").value, 10);

      const payload = {
        node_id: node,
        interface: iface,
        loss_pct: loss,
        delay_ms: delay,
        jitter_ms: 0
      };

      const res = await fetch('/api/v1/impair', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      logMsg(`Applied to ${node}:${iface} &rarr; loss:${loss}%, delay:${delay}ms`);
    }

    async function resetInterface() {
      const node = document.getElementById("nodeSelect").value;
      const iface = document.getElementById("ifaceSelect").value;

      const res = await fetch('/api/v1/reset', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ node_id: node, interface: iface })
      });
      const data = await res.json();
      logMsg(`Reset ${node}:${iface} back to default`);
    }

    setInterval(fetchTopology, 1000);
    fetchTopology();
  </script>
</body>
</html>
